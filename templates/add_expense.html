{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add expense</h1>
            <p class="auth-subtitle">Record a new spending entry</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/expenses/add">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title"
                           class="form-input" placeholder="e.g. Grocery run"
                           required autofocus>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" name="amount"
                               class="form-input" placeholder="0.00"
                               min="0.01" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date"
                               class="form-input" value="{{ today }}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input">
                        <option value="Food &amp; Dining">Food &amp; Dining</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Bills &amp; Utilities">Bills &amp; Utilities</option>
                        <option value="Other" selected>Other</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Save expense</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('dashboard') }}">← Back to dashboard</a>
        </p>

    </div>
</section>
{% endblock %}
